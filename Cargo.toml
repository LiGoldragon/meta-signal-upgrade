[package]
name         = "meta-signal-upgrade"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-upgrade"
description  = "Meta-signal contract for the meta-policy upgrade surface."
publish      = false
links        = "meta-signal-upgrade"
build        = "build.rs"

[lib]
name = "meta_signal_upgrade"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec.git", rev = "cd0255d774847826d53d063ab856ebe0dd09e250", optional = true }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "ca72b2d1151f", default-features = false }
thiserror         = "2"

[build-dependencies]
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "9bce5ed8efadeb157811b256aa69a1f88cd5314f" }
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "6179a7cf1394083244dd3f3e1d2709f9ec08f7db" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
