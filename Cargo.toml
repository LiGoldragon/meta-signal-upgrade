[package]
name         = "meta-signal-upgrade"
version      = "0.2.3"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-upgrade"
description  = "Meta-signal contract for the meta-policy upgrade surface."
publish      = false

[lib]
name = "meta_signal_upgrade"
path = "src/lib.rs"

[features]
default = []
nota-text = [
    "dep:nota",
    "signal-frame/nota-text",
]

[dependencies]
nota        = { git = "https://github.com/LiGoldragon/nota.git", branch = "main", optional = true }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame      = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "drop-next", default-features = false }
thiserror         = "2"

[dev-dependencies]
nota        = { git = "https://github.com/LiGoldragon/nota.git", branch = "main" }

[build-dependencies]
schema = { git = "https://github.com/LiGoldragon/schema.git", branch = "drop-next" }
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", branch = "drop-next" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
